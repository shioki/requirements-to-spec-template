name: Docs checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: |
            **/*.md

  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli@12.0.0

      - name: Render Mermaid diagrams
        run: python3 scripts/check_mermaid.py
